<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-labelledby="t h">
  <title id="t">Aurora Program Horizontal Logo</title>
  <desc id="h">Horizontal logotype with radiant pyramid mark.</desc>
  <defs>
    <linearGradient id="gradCoreH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="55%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#F0E68C"/>
    </linearGradient>
    <radialGradient id="radAuraH" cx="40%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#F0E68C" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#2563eb" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="520" height="160" rx="28" fill="#0f172a"/>
  <g transform="translate(24,12)">
