    <circle cx="68" cy="14" r="5" fill="#F0E68C"/>
  </g>
  <g fill="#f1f5f9" font-family="'Inter',system-ui,sans-serif" font-weight="600" letter-spacing="1px" font-size="60" transform="translate(180,108)">
