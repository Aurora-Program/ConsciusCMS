<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Aurora Program Mark</title>
  <desc id="desc">Simplified pyramid radiant mark for Aurora / ConsciusCMS brand.</desc>
  <defs>
    <linearGradient id="gradCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="55%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#F0E68C"/>
    </linearGradient>
    <radialGradient id="radAura" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#F0E68C" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="75%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="160" height="160" rx="24" fill="#0f172a"/>
  <circle cx="80" cy="72" r="60" fill="url(#radAura)"/>
  <g filter="url(#softGlow)">
    <polygon points="80,24 32,136 128,136" fill="url(#gradCore)" stroke="#F0E68C" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="80,24 32,136 80,136" fill="rgba(15,23,42,0.35)"/>
    <line x1="80" y1="24" x2="80" y2="136" stroke="rgba(255,255,255,0.45)" stroke-width="2" stroke-linecap="round"/>
  </g>
  <circle cx="80" cy="24" r="5" fill="#F0E68C"/>
</svg>
